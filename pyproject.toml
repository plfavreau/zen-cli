[project]
name = "zen-cli"
version = "0.1.0"
description = "Drive a dedicated Zen Browser folder per git worktree - open, click, fill, scroll, screenshot."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pierre-Louis Favreau" }]
requires-python = ">=3.11,<3.13"
dependencies = ["marionette-driver>=3.4.0"]

[project.urls]
Homepage = "https://github.com/plfavreau/zen-cli"

[project.scripts]
zen-cli = "zen_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zen_cli"]

[tool.ruff]
line-length = 90
