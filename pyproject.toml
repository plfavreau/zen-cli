[project]
name = "zen-folders"
version = "0.1.0"
description = "One git worktree, one Zen Browser folder."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pierre-Louis Favreau" }]
requires-python = ">=3.11,<3.13"
dependencies = ["marionette-driver>=3.4.0"]

[project.urls]
Homepage = "https://github.com/plfavreau/zen-folders"

[project.scripts]
zen-folders = "zen_folders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zen_folders"]

[tool.ruff]
line-length = 90
